name: Upstream changes

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: upstream-changes

jobs:
  notify:
    if: github.repository == 'LazyBuddyDev/openhongguo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REVIEWED: cac5dbc0e1150c0f93e309d8de68bb483f50f499
    steps:
      - name: Report new upstream commits
        shell: bash
        run: |
          set -euo pipefail
          latest=$(curl --fail --silent --show-error --max-time 20 \
            https://api.github.com/repos/beilunyang/openhongguo/commits/main | jq -er '.sha')
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]]
          [[ "$latest" != "$REVIEWED" ]] || exit 0
          title="Review openhongguo upstream ${latest}"
          existing=$(gh issue list --state all --search "${latest} in:title" --json title \
            --jq "map(select(.title == \"$title\")) | length")
          [[ "$existing" == 0 ]] || exit 0
          gh issue create --title "$title" --assignee Leager-zju --body-file - <<EOF
          Compare the reviewed baseline with upstream main:
          https://github.com/beilunyang/openhongguo/compare/${REVIEWED}...${latest}

          Review the changes and cherry-pick relevant fixes after regression tests.
          EOF
